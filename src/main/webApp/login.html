<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in &middot; Ticketing Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>

<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <span class="brand-mark">TMS</span>
            <span class="brand-name">Ticketing</span>
        </div>

        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">Enter your credentials to access your tickets.</p>

        <div class="alert alert-danger" id="loginAlert" role="alert" style="display:none;"></div>

        <form id="loginForm" novalidate>
            <div class="form-field">
                <label class="form-label" for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
            </div>
            <div class="form-field">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginSubmitBtn">
                <span class="btn-spinner" id="loginSpinner" style="display:none;"></span>
                <span>Sign in</span>
            </button>
        </form>

        <p class="auth-hint">
            Trouble signing in? Contact your workspace administrator.<br>
            Preview build: try <strong>admin</strong> / any password if no backend is connected yet.
        </p>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script>
    $(function () { App.initLoginPage(); });
</script>
</body>
</html>
