<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Detail &middot; Ticketing Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>

<div id="includeSidebar"></div>

<div class="app-main">
    <div id="includeNavbar"></div>

    <main class="main-content" id="ticketDetailBody">
        <a href="tickets.html" class="cell-muted" style="font-size:.83rem; display:inline-flex; align-items:center; gap:.3rem; margin-bottom:1rem;">
            <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="m12 5-6 5 6 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Back to tickets
        </a>

        <div class="ticket-header-row">
            <div>
                <span class="ticket-number-tag" id="ticketNumberTag">&hellip;</span>
                <h1 class="ticket-title" id="ticketTitle">Loading ticket&hellip;</h1>
            </div>
            <div class="u-flex u-gap-sm" id="ticketPriorityBadge"></div>
            <div class="u-flex u-gap-sm" id="ticketStatusBadge"></div>
        </div>

        <div class="detail-grid">
            <div>
                <div class="card" style="margin-bottom:1.25rem;">
                    <div class="card-header"><h3>Description</h3></div>
                    <div class="card-body">
                        <p class="description-block" id="ticketDescription">&hellip;</p>
                    </div>
                </div>

                <div class="card" style="margin-bottom:1.25rem;">
                    <div class="card-header"><h3>Activity</h3></div>
                    <div class="card-body">
                        <ul class="ticket-timeline" id="ticketTimeline"></ul>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><h3>Add Comment</h3></div>
                    <div class="card-body">
                        <form id="commentForm">
                            <div class="form-field">
                                <label class="form-label visually-hidden" for="commentInput">Comment</label>
                                <textarea class="form-control" id="commentInput" placeholder="Add an update or note for this ticket&hellip;" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary btn-sm" id="addCommentBtn">Post Comment</button>
                        </form>
                    </div>
                </div>
            </div>

            <div>
                <div class="card" style="margin-bottom:1.25rem;">
                    <div class="card-header"><h3>Details</h3></div>
                    <div class="card-body">
                        <ul class="meta-list">
                            <li><span class="meta-label">Category</span><span class="meta-value" id="metaCategory">&hellip;</span></li>
                            <li><span class="meta-label">Created by</span><span class="meta-value" id="metaCreatedBy">&hellip;</span></li>
                            <li><span class="meta-label">Assigned to</span><span class="meta-value" id="metaAssignedTo">&hellip;</span></li>
                            <li><span class="meta-label">Created</span><span class="meta-value" id="metaCreatedAt">&hellip;</span></li>
                            <li><span class="meta-label">Updated</span><span class="meta-value" id="metaUpdatedAt">&hellip;</span></li>
                            <li><span class="meta-label">Resolved</span><span class="meta-value" id="metaResolvedAt">&hellip;</span></li>
                        </ul>
                    </div>
                </div>

                <div class="card staff-only">
                    <div class="card-header"><h3>Update Status</h3></div>
                    <div class="card-body">
                        <form id="statusUpdateForm">
                            <div class="form-field">
                                <label class="form-label visually-hidden" for="statusSelect">Status</label>
                                <select class="form-control" id="statusSelect">
                                    <option value="OPEN">Open</option>
                                    <option value="IN_PROGRESS">In Progress</option>
                                    <option value="RESOLVED">Resolved</option>
                                    <option value="CLOSED">Closed</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary btn-block btn-sm" id="updateStatusBtn">
                                <span class="btn-spinner" style="display:none;"></span>
                                <span>Update Status</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="includeFooter"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/ticket-detail.js"></script>
</body>
</html>
