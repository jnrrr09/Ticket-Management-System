<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard &middot; Ticketing Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="CSS/custom.css" rel="stylesheet">
</head>
<body>

<div id="includeSidebar"></div>

<div class="app-main">
    <div id="includeNavbar"></div>

    <main class="main-content" id="dashboardPageBody">
        <h2 class="section-heading">Welcome back, <span id="welcomeName">&hellip;</span></h2>
        <p class="section-subheading">Here's what's happening across your tickets today.</p>

        <div class="stat-grid" id="statGrid">
            <div class="stat-card"><div class="skeleton" style="height:14px;width:60%;margin-bottom:.8rem"></div><div class="skeleton" style="height:28px;width:40%"></div></div>
            <div class="stat-card"><div class="skeleton" style="height:14px;width:60%;margin-bottom:.8rem"></div><div class="skeleton" style="height:28px;width:40%"></div></div>
            <div class="stat-card"><div class="skeleton" style="height:14px;width:60%;margin-bottom:.8rem"></div><div class="skeleton" style="height:28px;width:40%"></div></div>
        </div>

        <div class="card" id="workloadCard" style="display:none;">
            <div class="card-header">
                <h3>Agent Workload</h3>
                <span class="cell-muted" style="font-size:.78rem;">Open tickets per agent</span>
            </div>
            <div class="card-body">
                <div class="bar-chart" id="workloadChart"></div>
            </div>
        </div>
    </main>

    <div id="includeFooter"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
