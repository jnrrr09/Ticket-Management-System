<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets &middot; Ticketing Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/custom.css" rel="stylesheet">
</head>
<body>

<div id="includeSidebar"></div>

<div class="app-main">
    <div id="includeNavbar"></div>

    <main class="main-content" id="ticketsPageBody">
        <div class="card">
            <div class="card-header">
                <h2>All Tickets</h2>
                <button type="button" class="btn btn-primary btn-sm" id="newTicketBtn">
                    <svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
                    New Ticket
                </button>
            </div>

            <div class="card-body" style="padding-bottom:0.75rem;">
                <div class="filter-bar">
                    <select class="form-control" id="statusFilter" aria-label="Filter by status">
                        <option value="">All statuses</option>
                        <option value="OPEN">Open</option>
                        <option value="IN_PROGRESS">In Progress</option>
                        <option value="RESOLVED">Resolved</option>
                        <option value="CLOSED">Closed</option>
                    </select>
                    <select class="form-control" id="priorityFilter" aria-label="Filter by priority">
                        <option value="">All priorities</option>
                        <option value="LOW">Low</option>
                        <option value="MEDIUM">Medium</option>
                        <option value="HIGH">High</option>
                        <option value="CRITICAL">Critical</option>
                    </select>
                    <div class="filter-search">
                        <svg viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"/><path d="m17 17-3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                        <input type="text" class="form-control" id="searchInput" placeholder="Search visible tickets&hellip;">
                    </div>
                </div>
            </div>

            <div id="ticketsTableWrap" class="table-wrap">
                <table class="data-table">
                    <thead>
                    <tr>
                        <th>Ticket #</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Created By</th>
                        <th>Assigned To</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody id="ticketsTableBody"></tbody>
                </table>
            </div>

            <div class="empty-state" id="ticketsEmptyState" style="display:none;">
                <svg viewBox="0 0 24 24" fill="none"><path d="M4 7a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v1.7a1.8 1.8 0 0 0 0 3.6V16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-3.7a1.8 1.8 0 0 0 0-3.6V7Z" stroke="currentColor" stroke-width="1.5"/></svg>
                <div class="empty-state-title">No tickets found</div>
                <div class="empty-state-desc">Try adjusting your filters, or create a new ticket to get started.</div>
            </div>

            <div class="pagination-bar">
                <span class="pagination-info" id="paginationInfo">Loading&hellip;</span>
                <div class="pagination-controls" id="paginationControls"></div>
            </div>
        </div>
    </main>

    <div id="includeFooter"></div>
</div>

<!-- New Ticket modal -->
<div class="modal-scrim" id="newTicketScrim"></div>
<div class="app-modal" id="newTicketModal" role="dialog" aria-modal="true" aria-labelledby="newTicketModalTitle">
    <div class="modal-header">
        <h3 id="newTicketModalTitle">New Ticket</h3>
        <button type="button" class="modal-close-btn" id="closeNewTicketModal" aria-label="Close">
            <svg viewBox="0 0 20 20" fill="none"><path d="m5 5 10 10M15 5 5 15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        </button>
    </div>
    <form id="newTicketForm">
        <div class="modal-body">
            <div class="alert alert-danger" id="newTicketAlert" style="display:none;"></div>

            <div class="form-field">
                <label class="form-label" for="ticketTitleInput">Title</label>
                <input type="text" class="form-control" id="ticketTitleInput" placeholder="Short summary of the issue" required>
            </div>

            <div class="form-field">
                <label class="form-label" for="ticketCategoryInput">Category</label>
                <select class="form-control" id="ticketCategoryInput">
                    <option value="">Select Category</option>
                    <option value="4">Bug</option>
                    <option value="5">Technical Issue</option>
                    <option value="1">IT Support</option>
                    <option value="2">Software & Apps</option>
                    <option value="3">Network & VPN</option>
                    <option value="6">Feature Request</option>
                    <option value="7">Support</option>

                </select>
            </div>

            <div class="form-field">
                <label class="form-label" for="ticketPriorityInput">Priority</label>
                <select class="form-control" id="ticketPriorityInput">
                    <option value="LOW">Low</option>
                    <option value="MEDIUM" selected>Medium</option>
                    <option value="HIGH">High</option>
                    <option value="CRITICAL">Critical</option>
                </select>
            </div>

            <div class="form-field">
                <label class="form-label" for="ticketDescriptionInput">Description</label>
                <textarea class="form-control" id="ticketDescriptionInput" placeholder="Steps to reproduce, expected vs. actual behavior, etc." required></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline" id="cancelNewTicketBtn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="createTicketBtn">
                <span class="btn-spinner" id="createTicketSpinner" style="display:none;"></span>
                <span>Create Ticket</span>
            </button>
        </div>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
<script src="js/tickets.js"></script>
</body>
</html>
